<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tempos — Gestion du temps de travail</title>
<style>
  :root { font-family: Inter, system-ui, sans-serif; color:#1e293b; background:#f1f5f9; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; }
  h1 { font-size:1.4rem; margin:0; }
  h2 { font-size:1.1rem; margin:0 0 8px; }
  .muted { color:#64748b; font-size:.85rem; }
  header { display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .badge { border:1px solid #6ee7b7; background:#ecfdf5; color:#047857; padding:4px 10px; border-radius:999px; font-size:.75rem; }
  .badge.blue { border-color:#93c5fd; background:#eff6ff; color:#1d4ed8; }
  .bell { position:relative; border:1px solid #cbd5e1; background:#fff; border-radius:8px; padding:7px 12px; cursor:pointer; font-size:.9rem; }
  .bell .cnt { position:absolute; top:-7px; right:-7px; background:#dc2626; color:#fff; border-radius:999px; font-size:.65rem; padding:1px 5px; }
  nav { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  nav button { padding:8px 14px; border-radius:8px; border:1px solid #cbd5e1; background:#fff; cursor:pointer; font-size:.85rem; font-weight:500; }
  nav button.active { background:#0f172a; color:#fff; border-color:#0f172a; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h3 { margin:0 0 10px; font-size:.95rem; }
  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #e2e8f0; }
  th { color:#475569; font-weight:600; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
  label { display:block; font-size:.75rem; color:#475569; margin-bottom:3px; }
  input, select, textarea { padding:7px 9px; border:1px solid #cbd5e1; border-radius:8px; font-size:.85rem; width:100%; background:#fff; font-family:inherit; }
  .btn { padding:8px 14px; border-radius:8px; border:none; background:#2563eb; color:#fff; cursor:pointer; font-size:.85rem; }
  .btn.danger { background:#dc2626; } .btn.ghost { background:#e2e8f0; color:#0f172a; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .tag { padding:2px 8px; border-radius:999px; font-size:.72rem; background:#e2e8f0; }
  .tag.ok { background:#dcfce7; color:#166534; } .tag.warn { background:#fef3c7; color:#92400e; } .tag.err { background:#fee2e2; color:#991b1b; }
  .toast { position:fixed; bottom:16px; right:16px; background:#0f172a; color:#fff; padding:12px 16px; border-radius:10px; font-size:.85rem; max-width:340px; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:60; }
  .bar { background:#2563eb; height:14px; border-radius:4px; }
  .barrow { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:.8rem; }
  .barrow .lbl { width:150px; }
  .barrow .track { flex:1; background:#f1f5f9; border-radius:4px; }
  .alert { border:1px solid #cbd5e1; border-radius:10px; padding:12px 14px; background:#fff; margin-bottom:16px; font-size:.85rem; }
  .alert b { display:block; margin-bottom:4px; }
  ul.clean { margin:6px 0 0; padding-left:18px; font-size:.82rem; color:#475569; }
  #audit { max-height:180px; overflow:auto; font-size:.75rem; color:#475569; }
  .notif { border:1px solid #e2e8f0; border-left:4px solid #2563eb; border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:.85rem; background:#fff; }
  .notif.unread { background:#eff6ff; }
  .notif .meta { color:#64748b; font-size:.72rem; margin-top:4px; }
  .msg { max-width:70%; padding:9px 12px; border-radius:12px; font-size:.85rem; margin-bottom:6px; }
  .msg.me { background:#2563eb; color:#fff; margin-left:auto; }
  .msg.other { background:#e2e8f0; }
  .msg .t { font-size:.65rem; opacity:.7; margin-top:3px; }
  #thread { max-height:320px; overflow:auto; padding:8px; background:#f8fafc; border-radius:10px; border:1px solid #e2e8f0; display:flex; flex-direction:column; }
  /* Connexion */
  #loginWrap { max-width:380px; margin:8vh auto; }
  #loginWrap .card { box-shadow:0 10px 30px rgba(0,0,0,.08); }
  /* Impression */
  #printArea { display:none; }
  @media print {
    body > *:not(#printArea) { display:none !important; }
    #printArea { display:block !important; }
    body { background:#fff; padding:0; }
    table { font-size:10pt; }
    .ph { page-break-after:always; }
  }
</style>
</head>
<body>

<div id="loginWrap" class="hidden">
  <div class="card">
    <h2>🔐 Connexion — Tempos</h2>
    <p class="muted" style="margin-top:0">Chaque salarié accède uniquement à ses propres informations.</p>
    <div style="margin-bottom:10px"><label>Utilisateur</label><select id="loginUser"></select></div>
    <div style="margin-bottom:12px"><label>Code d'accès</label><input type="password" id="loginPin" placeholder="Code personnel"></div>
    <button class="btn" id="btnLogin" style="width:100%">Se connecter</button>
    <p class="muted" style="margin-bottom:0">Démo : code <b>1234</b> pour tous les comptes.</p>
  </div>
</div>

<div id="shell" class="hidden">
  <header>
    <div>
      <h1>⏱️ Tempos — Gestion du temps de travail</h1>
      <div class="muted">Planning, saisies horaires, congés, échanges &amp; décomptes</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <span class="badge">🔐 RGPD</span>
      <span id="whoami" class="badge blue"></span>
      <button class="bell" id="btnBell">🔔<span class="cnt hidden" id="bellCnt"></span></button>
      <button class="btn ghost" id="btnLogout">Déconnexion</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <div id="app"></div>
</div>

<div id="toastHost"></div>
<div id="printArea"></div>

<script>
// ---------- Modèle de données ----------
const EMPLOYEES = [
  { id:"e1", name:"David Szlachta", role:"admin", email:"david.szlachta@entreprise.fr", weekly:35 },
  { id:"e2", name:"Claire Martin", role:"salarie", email:"claire.martin@entreprise.fr", weekly:35 },
  { id:"e3", name:"Yassine Bakkali", role:"salarie", email:"y.bakkali@entreprise.fr", weekly:39 },
  { id:"e4", name:"Sophie Nguyen", role:"salarie", email:"s.nguyen@entreprise.fr", weekly:24 },
];
const TODAY = new Date().toISOString().slice(0,10);
const MK = d => d.slice(0,7);

function seed() {
  return {
    entries: [
      {id:"s1",emp:"e2",date:"2026-10-05",start:"09:00",end:"17:30",pause:45},
      {id:"s2",emp:"e2",date:"2026-10-06",start:"09:00",end:"18:00",pause:45},
      {id:"s3",emp:"e3",date:"2026-10-05",start:"08:00",end:"17:00",pause:60},
      {id:"s4",emp:"e3",date:"2026-10-06",start:"08:00",end:"18:30",pause:45},
      {id:"s5",emp:"e4",date:"2026-10-05",start:"09:00",end:"13:00",pause:0},
      {id:"s6",emp:"e2",date:"2026-11-02",start:"09:00",end:"17:30",pause:45},
      {id:"s7",emp:"e3",date:"2026-11-02",start:"08:00",end:"17:00",pause:60},
    ],
    leaves: [
      {id:"l1",emp:"e2",type:"Congé payé",start:"2026-12-21",end:"2026-12-25",days:5,status:"approuvé"},
      {id:"l3",emp:"e4",type:"Maladie",start:"2026-10-14",end:"2026-10-15",days:2,status:"approuvé"},
    ],
    closed: ["2026-10"],
    targets: {e1:1607,e2:1607,e3:1791,e4:1102},
    pins: {e1:"1234",e2:"1234",e3:"1234",e4:"1234"},
    notifs: [],
    msgs: [],
    remindersSent: {},
    emailCfg: { smtp:"smtp.entreprise.fr:587", from:"tempos@entreprise.fr", weekly:"vendredi 17h00", monthly:"dernier jour du mois, 17h00" },
    audit: [{ts:"2026-11-03 08:12",actor:"David Szlachta",act:"Clôture du mois 2026-10"}],
  };
}
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
};
let db;
try { db = JSON.parse(store.get("tempos-db")) || seed(); if(!db || !db.entries) db = seed(); }
catch(e){ db = seed(); }
if(!db.pins) db.pins={e1:"1234",e2:"1234",e3:"1234",e4:"1234"};
if(!db.notifs) db.notifs=[]; if(!db.msgs) db.msgs=[]; if(!db.remindersSent) db.remindersSent={};
if(!db.emailCfg) db.emailCfg=seed().emailCfg;
// Salariés ajoutés par l'administrateur (invitations)
if(db.roster) db.roster.forEach(e=>{ if(!EMPLOYEES.some(x=>x.id===e.id)) EMPLOYEES.push(e); });
function save(){ store.set("tempos-db", JSON.stringify(db)); }

let me = null;
let editingEntry=null, editingLeave=null, chatWith="e2";

const isAdmin = () => me && me.role==="admin";
const isClosed = d => db.closed.includes(MK(d));
const hrs = e => { if(!e.start||!e.end) return 0;
  const [sh,sm]=e.start.split(":"),[eh,em]=e.end.split(":");
  return Math.max(0,((eh*60+em)-(sh*60+sm)-(e.pause||0))/60); };
const f = h => h.toFixed(2).replace(".",",")+" h";
const empName = id => (EMPLOYEES.find(e=>e.id===id)||{}).name || "?";
const empEmail = id => (EMPLOYEES.find(e=>e.id===id)||{}).email || "?";
const wk = d => { const dt=new Date(d), s=new Date(dt.getFullYear(),0,1);
  return dt.getFullYear()+"-S"+String(Math.ceil(((dt-s)/864e5+s.getDay()+1)/7)).padStart(2,"0"); };

function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
        g=Math.floor((b+8)/25),h=(19*a+b-g-Math.floor((b-g+1)/3)+15)%30,
        i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
        month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
  return new Date(y,month-1,day);
}
function frenchHolidays(y){
  const e=easter(y), add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
  const iso=d=>d.toISOString().slice(0,10);
  return [y+"-01-01", iso(add(e,1)), y+"-05-01", y+"-05-08", iso(add(e,39)),
    iso(add(e,50)), y+"-07-14", y+"-08-15", y+"-11-01", y+"-11-11", y+"-12-25"];
}
const holidaySet=(()=>{ const s=new Set(); for(let y=2024;y<=2030;y++) frenchHolidays(y).forEach(d=>s.add(d)); return s; })();
const isHoliday = d => holidaySet.has(d);
const isSunday = d => new Date(d+"T00:00:00").getDay()===0;
function workingDays(start,end){
  let n=0; const d=new Date(start+"T00:00:00"), stop=new Date(end+"T00:00:00");
  while(d<=stop){ const iso=d.toISOString().slice(0,10);
    if(!isSunday(iso)&&!isHoliday(iso)) n++; d.setDate(d.getDate()+1); }
  return n;
}

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.getElementById("toastHost").appendChild(t); setTimeout(()=>t.remove(),3500); }
function log(act){ db.audit.unshift({ts:TODAY+" "+new Date().toTimeString().slice(0,5),actor:me?me.name:"?",act}); save(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// ---------- Notifications "e-mail" ----------
// Chaque notification simule un e-mail : destinataire = boîte mail du salarié/admin.
// L'envoi réel (SMTP) sera branché côté serveur lors de l'intégration.
function sendMail(toEmpId, subject, body){
  db.notifs.unshift({id:"n"+Date.now()+Math.random().toString(36).slice(2,6),to:toEmpId,subject,body,date:TODAY+" "+new Date().toTimeString().slice(0,5),read:false});
  save();
}
function unreadCount(){ return db.notifs.filter(n=>n.to===me.id&&!n.read).length; }
function myMsgsUnread(){ return db.msgs.filter(m=>m.empId===me.id && (isAdmin()? m.from==="salarie"&&!m.readByAdmin : m.from==="admin"&&!m.readByEmp)).length; }

// Rappels automatiques : hebdo (salariés) + mensuel (admin)
function checkReminders(){
  const now=new Date(), day=now.getDay();
  const wkKey=wk(TODAY), mKey=MK(TODAY);
  // Rappel hebdomadaire de fin de semaine (vendredi/week-end) aux salariés
  if(day>=5){
    EMPLOYEES.filter(e=>e.role==="salarie").forEach(e=>{
      const key="w-"+wkKey+"-"+e.id;
      if(!db.remindersSent[key]){
        const missing=[];
        for(let i=0;i<5;i++){ const d=new Date(now); d.setDate(d.getDate()-i);
          const iso=d.toISOString().slice(0,10);
          if(d.getDay()!==0 && !isHoliday(iso) && !db.entries.some(x=>x.emp===e.id&&x.date===iso)) missing.push(iso); }
        db.remindersSent[key]=true;
        sendMail(e.id, "⏰ Rappel — saisie de vos heures de la semaine",
          missing.length? "Bonjour "+e.name.split(" ")[0]+",\n\nPensez à saisir vos heures pour la semaine "+wkKey+". Jours manquants : "+missing.join(", ")+".\n\nTempos"
                        : "Bonjour "+e.name.split(" ")[0]+",\n\nVos heures de la semaine "+wkKey+" sont complètes. Merci !\n\nTempos");
      }
    });
  }
  // Rappel mensuel de clôture à l'administrateur (fin de mois / début de mois suivant)
  const lastDay=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  if(now.getDate()>=lastDay-1 || now.getDate()<=3){
    const key="m-"+mKey+"-admin";
    if(!db.remindersSent[key]){
      db.remindersSent[key]=true;
      const n=db.entries.filter(e=>MK(e.date)===mKey&&e.status==="brouillon").length;
      sendMail("e1","📩 Clôture mensuelle — vérifiez et verrouillez les heures de "+mKey,
        "Bonjour,\n\nLe mois "+mKey+" touche à sa fin. "+(n? n+" saisie(s) sont en attente de validation.":"Toutes les saisies sont validées.")+
        "\nConnectez-vous à Tempos > Administration pour vérifier puis clôturer le mois.\n\nTempos");
    }
  }
  save();
}

// ---------- Connexion ----------
const loginWrap=document.getElementById("loginWrap"), shell=document.getElementById("shell");
const loginUser=document.getElementById("loginUser");
function refreshLoginOptions(sel){
  loginUser.innerHTML=EMPLOYEES.map(e=>`<option value="${e.id}" ${e.id===sel?"selected":""}>${esc(e.name)}${e.role==="admin"?" (administrateur)":""}</option>`).join("");
}
refreshLoginOptions();
document.getElementById("btnLogin").addEventListener("click",()=>{
  refreshLoginOptions(loginUser.value);
  const u=EMPLOYEES.find(e=>e.id===loginUser.value);
  if(db.pins[u.id]!==document.getElementById("loginPin").value) return toast("⛔ Code d'accès incorrect.");
  me=u; document.getElementById("loginPin").value="";
  checkReminders(); tab="dashboard"; render();
  toast("👋 Bienvenue, "+u.name.split(" ")[0]+".");
});
document.getElementById("loginPin").addEventListener("keydown",ev=>{ if(ev.key==="Enter") document.getElementById("btnLogin").click(); });
document.getElementById("btnLogout").addEventListener("click",()=>{ me=null; refreshLoginOptions(); loginWrap.classList.remove("hidden"); shell.classList.add("hidden"); });

// ---------- Bilan mensuel ----------
function buildReport(empId,mk){
  const emp=EMPLOYEES.find(e=>e.id===empId);
  const list=db.entries.filter(e=>e.emp===empId&&MK(e.date)===mk).sort((a,b)=>a.date.localeCompare(b.date));
  const weeks={}; list.forEach(e=>{ const w=wk(e.date); (weeks[w]=weeks[w]||[]).push(e); });
  const monthTotal=list.reduce((s,e)=>s+hrs(e),0);
  const lv=db.leaves.filter(l=>l.emp===empId&&(MK(l.start)===mk||MK(l.end)===mk||l.start<=mk+"-31"&&l.end>=mk+"-01"));
  const lvDays=lv.reduce((s,l)=>s+workingDays(l.start,l.end),0);
  const cumul=db.entries.filter(e=>e.emp===empId).reduce((s,e)=>s+hrs(e),0);
  let h=`<div class="ph"><h2>Bilan mensuel — ${emp.name} — ${mk}</h2>
  <p style="font-size:9pt;color:#475569">Document généré par Tempos · ${TODAY} · Confidentiel (données personnelles)</p>`;
  if(!list.length) h+=`<p>Aucune saisie pour ce mois.</p>`;
  Object.keys(weeks).sort().forEach(w=>{
    const wt=weeks[w].reduce((s,e)=>s+hrs(e),0);
    h+=`<h3 style="font-size:10pt;margin:10pt 0 4pt">Semaine ${w} — total ${f(wt)}</h3>
    <table border="0" cellpadding="3" style="width:100%"><tr style="background:#eef2f7"><th>Date</th><th>Jour</th><th>Arrivée</th><th>Départ</th><th>Pause</th><th>Total</th></tr>`+
    weeks[w].map(e=>{ const J=["dim","lun","mar","mer","jeu","ven","sam"][new Date(e.date+"T00:00:00").getDay()];
      return `<tr><td>${e.date}</td><td>${J}</td><td>${e.start}</td><td>${e.end}</td><td>${e.pause} min</td><td><b>${f(hrs(e))}</b></td></tr>`; }).join("")+`</table>`;
  });
  h+=`<h3 style="font-size:10pt;margin:12pt 0 4pt">Absences du mois</h3>
  ${lv.length?`<table border="0" cellpadding="3" style="width:100%"><tr style="background:#eef2f7"><th>Type</th><th>Du</th><th>Au</th><th>Jours ouvrés</th><th>Statut</th></tr>`+
    lv.map(l=>`<tr><td>${l.type}</td><td>${l.start}</td><td>${l.end}</td><td>${workingDays(l.start,l.end)} j</td><td>${l.status}</td></tr>`).join("")+`</table>`:`<p style="font-size:9pt">Aucune absence.</p>`}
  <h3 style="font-size:10pt;margin:12pt 0 4pt">Récapitulatif</h3>
  <table border="0" cellpadding="3"><tr><td>Total heures du mois</td><td><b>${f(monthTotal)}</b></td></tr>
  <tr><td>Jours d'absence (ouvrés)</td><td>${lvDays} j</td></tr>
  <tr><td>Cumul annuel / objectif</td><td>${f(cumul)} / ${db.targets[empId]} h</td></tr></table></div>`;
  return h;
}
function printReport(empId,mk){ document.getElementById("printArea").innerHTML=buildReport(empId,mk); setTimeout(()=>window.print(),50); }
function downloadReport(empId,mk){
  try{ const doc="<!doctype html><html lang='fr'><head><meta charset='utf-8'><title>Bilan "+empName(empId)+" "+mk+"</title><style>body{font-family:system-ui,sans-serif;margin:24px}table{border-collapse:collapse;width:100%;font-size:10pt}th,td{border:1px solid #cbd5e1;padding:4px 8px;text-align:left}th{background:#eef2f7}h2{border-bottom:2px solid #0f172a;padding-bottom:6px}</style></head><body>"+buildReport(empId,mk)+"</body></html>";
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([doc],{type:"text/html"}));
    a.download="bilan-"+empName(empId).replace(/\s+/g,"-").toLowerCase()+"-"+mk+".html";
    document.body.appendChild(a); a.click(); a.remove(); toast("📥 Bilan téléchargé.");
  }catch(e){ toast("⚠️ Téléchargement bloqué ici — utilisez « Imprimer »."); }
}
function printAll(mk){ document.getElementById("printArea").innerHTML=EMPLOYEES.map(e=>buildReport(e.id,mk)).join(""); setTimeout(()=>window.print(),50); }
function downloadAll(mk){
  try{ const doc="<!doctype html><html lang='fr'><head><meta charset='utf-8'><title>Bilans "+mk+"</title><style>body{font-family:system-ui,sans-serif;margin:24px}table{border-collapse:collapse;width:100%;font-size:10pt}th,td{border:1px solid #cbd5e1;padding:4px 8px;text-align:left}th{background:#eef2f7}h2{border-bottom:2px solid #0f172a;padding-bottom:6px}.ph{page-break-after:always}</style></head><body>"+EMPLOYEES.map(e=>buildReport(e.id,mk)).join("")+"</body></html>";
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([doc],{type:"text/html"}));
    a.download="bilans-tous-salaries-"+mk+".html";
    document.body.appendChild(a); a.click(); a.remove(); toast("📥 Bilans téléchargés.");
  }catch(e){ toast("⚠️ Téléchargement bloqué ici — utilisez « Imprimer »."); }
}

// ---------- Rendu ----------
function render(){
  if(!me){ loginWrap.classList.remove("hidden"); shell.classList.add("hidden"); return; }
  loginWrap.classList.add("hidden"); shell.classList.remove("hidden");
  document.getElementById("whoami").textContent=me.name+(isAdmin()?" · Administrateur":" · Salarié");
  const bell=document.getElementById("btnBell"), cnt=document.getElementById("bellCnt");
  const uc=unreadCount();
  cnt.textContent=uc; cnt.classList.toggle("hidden",uc===0);
  bell.onclick=()=>{ tab="notifications"; render(); };

  const NAV=[["dashboard","Tableau de bord"],["saisie","Saisie horaire"],["planning","Planning / Horaires"],["conges","Congés & Absences"],["echanges","Échanges ✉️"+(myMsgsUnread()?" ("+myMsgsUnread()+")":"")],["syntheses","Synthèses"],["bilan","Bilan mensuel 🖨️"],["notifications","Notifications 📬"],["admin","Administration 🔒"]];
  const nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(([k,l])=>(k==="admin"&&!isAdmin())?"":`<button data-t="${k}" class="${tab===k?"active":""}">${l}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ tab=b.dataset.t; render(); }));

  const app=document.getElementById("app");
  const scopeEntries=()=>db.entries.filter(e=>isAdmin()||e.emp===me.id).sort((a,b)=>b.date.localeCompare(a.date));
  const scopeLeaves=()=>db.leaves.filter(l=>isAdmin()||l.emp===me.id);

  function entryTable(list,withActions,editable){

  let html="";

        `<span style="color:#b45309">⏰ ${missing.length} salarié(s) sans saisie du ${TODAY} :</span><ul class="clean">${missing.map(e=>`<li>${esc(e.name)}</li>`).join("")}</ul>`}</div>
      <div class="card"><h3>📩 Notifications en cours</h3>
        ${draft>0?`⚠️ <b>${draft}</b> saisie(s) attendent votre validation.`:`<span style="color:#047857">✅ Aucune saisie en attente.</span>`}

      `<div class="card"><h3>🔔 Mon rappel de saisie</h3>${

      <div class="card"><h3>🗓️ Mois clôturés</h3>${

      <div class="card"><h3>👤 Mon récapitulatif</h3>

    </table></div>`;

  if(tab==="conges"){

      ${scopeLeaves().map(l=>`<tr><td>${esc(empName(l.emp))}</td><td>${l.type}</td><td>${l.start} → ${l.end}</td><td>${workingDays(l.start,l.end)} j</td>

        ${isAdmin()?`<td>${l.status==="en attente"?`<button class="btn" data-ok="${l.id}">✅</button> <button class="btn danger" data-no="${l.id}">❌</button> `:""}<button class="btn ghost" data-leave-edit="${l.id}">✏️</button></td>`:""}</tr>`).join("")}

  if(tab==="echanges"){

    html=`<div class="alert"><b>✉️ Échanges écrits</b>Espace de demandes et d'échanges entre le salarié et l'administrateur. ${isAdmin()?"Sélectionnez le salarié concerné.":"Vos messages sont adressés à l'administrateur."}</div>
    <div class="card">
      ${isAdmin()?`<div style="margin-bottom:10px"><label>Salarié</label><select id="chatEmp">${others.map(e=>`<option value="${e.id}" ${active===e.id?"selected":""}>${esc(e.name)}</option>`).join("")}</select></div>`:""}
      <div id="thread">${thread.length?thread.map(m=>`<div class="msg ${m.from==="salarie"?"other":"me"}" style="${m.from==="salarie"?"align-self:flex-start":"align-self:flex-end"}">

    const maxW=Math.max(1,...wks.flatMap(w=>Object.values(weeks[w])));
    const COLORS={e1:"#2563eb",e2:"#16a34a",e3:"#d97706",e4:"#9333ea"};
    html=(isAdmin()?`<div class="card"><h3>📊 Décompte hebdomadaire des heures (tous salariés)</h3>
      ${wks.map(w=>`<div style="margin-bottom:10px"><b style="font-size:.8rem">${w}</b>
        ${EMPLOYEES.map(e=>weeks[w][e.emp]?`<div class="barrow"><span class="lbl">${esc(e.name.split(" ")[0])}</span>
          <span class="track"><span class="bar" style="width:${weeks[w][e.emp]/maxW*100}%;background:${COLORS[e.id]}"></span></span>
          <b>${f(weeks[w][e.emp])}</b></div>`:"").join("")}</div>`).join("")||`<span class="muted">Aucune donnée.</span>`}</div>`:"")+
    `<div class="card"><h3>${isAdmin()?"Synthèse annuelle — tous salariés":"Ma synthèse annuelle"}</h3><table>

      :`<span class="muted">Aucun mois clôturé pour l'instant.</span>`}</div>`:""}`;
  }

  if(tab==="notifications"){
    const mine=db.notifs.filter(n=>n.to===me.id);
    db.notifs.filter(n=>n.to===me.id).forEach(n=>n.read=true); save();

    ${mine.length?mine.map(n=>`<div class="notif ${n.read?"":"unread"}">

      <div class="meta">À : ${esc(empEmail(n.to))} · ${n.date} · via ${esc(db.emailCfg.from)}</div></div>`).join("")
    :`<div class="card"><span class="muted">Aucune notification pour l'instant. Les rappels hebdomadaires et mensuels apparaîtront ici.</span></div>`}`;
  }

  if(tab==="admin"){
    html=`<div class="alert"><b>🔐 Accès administrateur général</b>Vous seul pouvez clôturer les mois, valider et modifier les heures, gérer les demandes et les codes d'accès.</div>
    <div class="card"><h3>🔒 Clôture mensuelle</h3>
      <button class="btn" id="btnClose" ${db.closed.includes(MK(TODAY))?"disabled":""}>Clôturer le mois en cours (${MK(TODAY)})</button>
      <div style="margin-top:10px">${db.closed.map(m=>`<span class="tag" style="margin-right:8px">🔒 ${m} <a href="#" data-reopen="${m}" style="margin-left:4px">rouvrir</a></span>`).join("")}</div></div>
    <div class="card"><h3>🎯 Volume horaire annuel par salarié</h3>
      ${EMPLOYEES.map(e=>`<div class="barrow"><span class="lbl"><b>${esc(e.name)}</b></span>

    <div class="card"><h3>📨 Invitations des salariés</h3>
      <p class="muted" style="margin-top:0">Envoie par e-mail à chaque salarié son identifiant (adresse mail) et le code d'accès que vous lui avez attribué.</p>
      <table><tr><th>Salarié</th><th>E-mail</th><th>Code</th><th></th></tr>
      ${EMPLOYEES.map(e=>`<tr><td><b>${esc(e.name)}</b></td>

      <p class="muted" style="margin:8px 0 0">L'e-mail d'invitation contient l'adresse de connexion, le code d'accès et le rappel que les données sont confidentielles.</p></div>
    <div class="card"><h3>➕ Inviter un nouveau salarié</h3>
      <div class="grid">
        <div><label>Nom complet</label><input type="text" id="newName" placeholder="Prénom Nom"></div>

      </div>
      <p style="margin:12px 0 0"><button class="btn" id="btnAddEmp">Créer le compte et envoyer l'invitation</button></p></div>

      </div></div>`;
  }

  app.innerHTML=html;

  // ---------- Événements ----------
  app.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    const e=db.entries.find(x=>x.id===b.dataset.del);
    if(isClosed(e.date)) return toast("⛔ Mois clôturé : suppression impossible.");
    db.entries=db.entries.filter(x=>x.id!==e.id); save(); log("Suppression d'une saisie du "+e.date); toast("🗑️ Saisie supprimée."); render();
  }));
  app.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{ editingEntry=b.dataset.edit; tab="saisie"; render(); }));
  const btnCancelEdit=document.getElementById("btnCancelEdit");
  if(btnCancelEdit) btnCancelEdit.addEventListener("click",()=>{ editingEntry=null; render(); });
  const btnAddEntry=document.getElementById("btnAddEntry");
  if(btnAddEntry) btnAddEntry.addEventListener("click",()=>{
    const date=document.getElementById("fDate").value;
    if(isClosed(date)) return toast("⛔ Mois clôturé : la saisie est verrouillée pour cette date.");
    const emp=isAdmin()?(document.getElementById("fEmp")?document.getElementById("fEmp").value:me.id):me.id;
    const data={emp,date,start:document.getElementById("fStart").value,end:document.getElementById("fEnd").value,pause:+document.getElementById("fPause").value||0};
    if(hrs(data)<=0) return toast("⚠️ Horaires invalides.");
    if(editingEntry){
      const e=db.entries.find(x=>x.id===editingEntry);
      if(isClosed(e.date)) return toast("⛔ Mois clôturé : modification impossible.");
      Object.assign(e,data); editingEntry=null;
      log(`Modification d'une saisie du ${date} (${empName(emp)})`); toast("✅ Saisie mise à jour.");
    } else {
      db.entries.push(Object.assign({id:"x"+Date.now(),status:"brouillon"},data));
      log(`Saisie horaire du ${date} (${f(hrs(data))}) — ${empName(emp)}`);
      toast("✅ Saisie enregistrée ("+f(hrs(data))+") — en attente de validation mensuelle.");
    }
    save(); render();
  });
  const fDate=document.getElementById("fDate");
  if(fDate){ const chk=()=>{ const m=document.getElementById("lockMsg"); if(m) m.textContent=isClosed(fDate.value)?"⛔ Mois clôturé — saisie verrouillée":""; };
    fDate.addEventListener("input",chk); chk(); }

  const btnAddLeave=document.getElementById("btnAddLeave");
  if(btnAddLeave){
    const upd=()=>{ const s=document.getElementById("lStart").value,e2=document.getElementById("lEnd").value;
      document.getElementById("leaveDays").textContent=s&&e2?workingDays(s,e2)+" jour(s) ouvré(s) (hors dimanches et fériés)":""; };
    document.getElementById("lStart").addEventListener("input",upd);
    document.getElementById("lEnd").addEventListener("input",upd);
    upd();
    btnAddLeave.addEventListener("click",()=>{
      const s=document.getElementById("lStart").value,e2=document.getElementById("lEnd").value;
      const days=workingDays(s,e2);
      if(editingLeave){
        const l=db.leaves.find(x=>x.id===editingLeave);
        Object.assign(l,{type:document.getElementById("lType").value,start:s,end:e2,days});
        editingLeave=null; log(`Modification d'une demande d'absence (${empName(l.emp)})`); toast("✅ Demande mise à jour.");
      } else {
        const l={id:"l"+Date.now(),emp:me.id,type:document.getElementById("lType").value,start:s,end:e2,days,status:"en attente"};
        db.leaves.push(l);
        // Notification e-mail à l'administrateur
        sendMail("e1","📅 Nouvelle demande d'absence — "+me.name,
          me.name+" a demandé : "+l.type+", du "+s+" au "+e2+" ("+days+" jour(s) ouvré(s)).\nConnectez-vous à Tempos pour accepter ou refuser.");
        log(`Demande d'absence ${l.type} du ${s} au ${e2} (${days} j ouvrés)`); toast("📅 Demande envoyée — l'administrateur a été notifié.");
      }
      save(); render();
    });
  }
  const btnCancelLeave=document.getElementById("btnCancelLeave");
  if(btnCancelLeave) btnCancelLeave.addEventListener("click",()=>{ editingLeave=null; render(); });
  app.querySelectorAll("[data-leave-edit]").forEach(b=>b.addEventListener("click",()=>{ editingLeave=b.dataset.leaveEdit; tab="conges"; render(); }));
  app.querySelectorAll("[data-ok]").forEach(b=>b.addEventListener("click",()=>{
    const l=db.leaves.find(x=>x.id===b.dataset.ok); l.status="approuvé";
    sendMail(l.emp,"✅ Demande d'absence approuvée","Bonjour,\n\nVotre demande ("+l.type+", du "+l.start+" au "+l.end+") a été approuvée par l'administrateur.\n\nTempos");
    log("Demande d'absence approuvée ("+empName(l.emp)+")"); toast("✅ Absence approuvée — le salarié est notifié."); render(); }));
  app.querySelectorAll("[data-no]").forEach(b=>b.addEventListener("click",()=>{
    const l=db.leaves.find(x=>x.id===b.dataset.no); l.status="refusé";
    sendMail(l.emp,"❌ Demande d'absence refusée","Bonjour,\n\nVotre demande ("+l.type+", du "+l.start+" au "+l.end+") a été refusée par l'administrateur.\n\nTempos");
    log("Demande d'absence refusée ("+empName(l.emp)+")"); toast("❌ Absence refusée — le salarié est notifié."); render(); }));

  // Échanges
  const chatEmp=document.getElementById("chatEmp");
  if(chatEmp) chatEmp.addEventListener("change",()=>{ chatWith=chatEmp.value; render(); });
  const btnSend=document.getElementById("btnSend");
  if(btnSend) btnSend.addEventListener("click",()=>{
    const txt=document.getElementById("msgText").value.trim();
    if(!txt) return toast("⚠️ Message vide.");
    const empId=isAdmin()?chatWith:me.id;
    db.msgs.push({empId,from:isAdmin()?"admin":"salarie",text:txt,ts:TODAY+" "+new Date().toTimeString().slice(0,5),
      readByAdmin:isAdmin(),readByEmp:!isAdmin()});
    if(isAdmin()) sendMail(empId,"✉️ Nouveau message de l'administrateur","Vous avez reçu un message dans l'espace Échanges de Tempos :\n\n« "+txt+" »");
    else sendMail("e1","✉️ Nouveau message — "+me.name,me.name+" vous a écrit dans l'espace Échanges :\n\n« "+txt+" »");
    save(); toast("✉️ Message envoyé."); render();
  });

  // Bilans
  const btnPrint=document.getElementById("btnPrint");
  if(btnPrint) btnPrint.addEventListener("click",()=>{
    const emp=document.getElementById("rEmp").value, mk=document.getElementById("rMonth").value;
    if(!mk) return toast("⚠️ Choisissez un mois.");
    if(emp==="all") printAll(mk); else printReport(emp,mk);
  });
  const btnDownload=document.getElementById("btnDownload");
  if(btnDownload) btnDownload.addEventListener("click",()=>{
    const emp=document.getElementById("rEmp").value, mk=document.getElementById("rMonth").value;
    if(!mk) return toast("⚠️ Choisissez un mois.");
    if(emp==="all") downloadAll(mk); else downloadReport(emp,mk);
  });
  app.querySelectorAll("[data-rprint]").forEach(b=>b.addEventListener("click",()=>{
    const [emp,mk]=b.dataset.rprint.split("|");
    if(emp==="all") printAll(mk); else printReport(emp,mk);
  }));

  const btnClose=document.getElementById("btnClose");
  if(btnClose) btnClose.addEventListener("click",()=>{ const m=MK(TODAY);
    db.closed.push(m); db.entries.forEach(e=>{ if(MK(e.date)===m) e.status="validé"; }); save();
    log("Clôture du mois "+m+" (validation des heures)");
    toast("🔒 Mois "+m+" clôturé. Bilans disponibles dans l'onglet « Bilan mensuel »."); tab="bilan"; render(); });
  app.querySelectorAll("[data-reopen]").forEach(a=>a.addEventListener("click",ev=>{ ev.preventDefault(); const m=a.dataset.reopen;
    db.closed=db.closed.filter(x=>x!==m);
    db.entries.forEach(e=>{ if(MK(e.date)===m) e.status="brouillon"; }); save();
    toast("🔓 Mois "+m+" rouvert."); log("Réouverture du mois "+m); render(); }));
  app.querySelectorAll("[data-target]").forEach(inp=>inp.addEventListener("change",()=>{
    db.targets[inp.dataset.target]=+inp.value||0; save();
    log("Volume annuel de "+empName(inp.dataset.target)+" fixé à "+inp.value+" h"); toast("🎯 Objectif mis à jour."); }));
  app.querySelectorAll("[data-pin]").forEach(inp=>inp.addEventListener("change",()=>{
    db.pins[inp.dataset.pin]=inp.value||"1234"; save(); toast("🔑 Code d'accès mis à jour."); }));
  app.querySelectorAll("[data-email]").forEach(inp=>inp.addEventListener("change",()=>{
    const e=EMPLOYEES.find(x=>x.id===inp.dataset.email); e.email=inp.value; save(); toast("📧 E-mail mis à jour."); }));
  app.querySelectorAll("[data-cfg]").forEach(inp=>inp.addEventListener("change",()=>{
    db.emailCfg[inp.dataset.cfg]=inp.value; save(); toast("📧 Paramètre enregistré."); }));

  // Invitations
  app.querySelectorAll("[data-invite]").forEach(b=>b.addEventListener("click",()=>{
    const e=EMPLOYEES.find(x=>x.id===b.dataset.invite);
    sendMail(e.id,"📨 Votre accès à Tempos — Gestion du temps de travail",
      "Bonjour "+e.name.split(" ")[0]+",\n\nVotre compte Tempos est prêt :\n"+
      "• Identifiant : "+e.email+"\n• Code d'accès : "+(db.pins[e.id]||"1234")+"\n\n"+
      "Connectez-vous pour saisir vos heures chaque jour et demander vos congés. Vos données sont strictement personnelles et confidentielles.\n\nL'administrateur");
    log("Invitation envoyée à "+e.name+" ("+e.email+")");
    toast("📨 Invitation envoyée à "+e.email); render();
  }));
  app.querySelectorAll("[data-emp-del]").forEach(b=>b.addEventListener("click",()=>{
    const e=EMPLOYEES.find(x=>x.id===b.dataset.empDel);
    if(db.entries.some(x=>x.emp===e.id)||db.leaves.some(x=>x.emp===e.id))
      return toast("⚠️ Ce salarié a des données enregistrées ; conservez son compte pour l'historique.");
    if(!confirm("Retirer l'accès de "+e.name+" ?")) return;
    db.roster=(db.roster||[]).filter(x=>x.id!==e.id);
    const i=EMPLOYEES.findIndex(x=>x.id===e.id); if(i>-1) EMPLOYEES.splice(i,1);
    save(); log("Accès retiré : "+e.name); toast("Accès retiré."); render();
  }));
  const btnAddEmp=document.getElementById("btnAddEmp");
  if(btnAddEmp) btnAddEmp.addEventListener("click",()=>{
    const name=document.getElementById("newName").value.trim();
    const email=document.getElementById("newEmail").value.trim();
    const pin=document.getElementById("newPin").value.trim()||String(1000+Math.floor(Math.random()*9000));
    if(!name||!email) return toast("⚠️ Nom et e-mail obligatoires.");
    const id="e"+Date.now();
    const emp={id,name,role:"salarie",email,weekly:+document.getElementById("newWeekly").value||35};
    EMPLOYEES.push(emp);
    db.roster=db.roster||[]; db.roster.push(emp);
    db.pins[id]=pin; db.targets[id]=+document.getElementById("newTarget").value||1607;
    sendMail(id,"📨 Votre accès à Tempos — Gestion du temps de travail",
      "Bonjour "+name.split(" ")[0]+",\n\nVotre compte Tempos a été créé :\n"+
      "• Identifiant : "+email+"\n• Code d'accès : "+pin+"\n\n"+
      "Connectez-vous pour saisir vos heures chaque jour et demander vos congés. Vos données sont strictement personnelles et confidentielles.\n\nL'administrateur");
    log("Nouveau salarié invité : "+name+" ("+email+")");
    save(); toast("✅ Compte créé — invitation envoyée à "+email); render();
  });
}
render();
</script>
</body>
</html>
